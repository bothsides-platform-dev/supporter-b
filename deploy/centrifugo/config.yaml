# Centrifugo v6 config — self-hosted realtime chat fanout.
# Operational runbook: docs/DEPLOY_LIGHTSAIL.md §Centrifugo
# Field reference:     deploy/centrifugo/README.md
#
# SECRETS: Centrifugo does NOT interpolate arbitrary ${VAR} here — plain values
# are literal strings, and secrets come from env vars injected by docker-compose
# under Centrifugo's own nested-key names. The ONE exception is map fields (e.g.
# proxy http.static_headers): Centrifugo v6.3.0+ extrapolates ${CENTRIFUGO_VAR_*}
# env vars INTO map values at boot — used below for the subscribe-proxy secret.
# See README.md for the .env.production → Centrifugo env name mapping table.

http_server:
  port: 8000

client:
  token:
    # Overridden by env: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
    # (bridged from app's CENTRIFUGO_TOKEN_HMAC_SECRET by docker-compose)
    hmac_secret_key: ""
  # Overridden by env: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
  # (derived from APP_DOMAIN by docker-compose → "https://<APP_DOMAIN>")
  allowed_origins: []

http_api:
  # Overridden by env: CENTRIFUGO_HTTP_API_KEY
  # (bridged from app's CENTRIFUGO_API_KEY by docker-compose)
  key: ""

channel:
  proxy:
    subscribe:
      # Private ACL boundary — server-to-server only, intentionally NOT through Caddy.
      # host.docker.internal resolves to the Lightsail host because the app runs
      # natively on PM2:3000, not inside Docker. compose maps it via
      # extra_hosts: host-gateway. app/api/centrifugo/subscribe/route.ts handles it.
      endpoint: "http://host.docker.internal:3000/api/centrifugo/subscribe"
      timeout: "5s"

      # ── Subscribe-proxy shared-secret header (CENTRIFUGO_PROXY_SECRET) ───────
      # Hardens this endpoint (also publicly reachable via Caddy). The app
      # (app/api/centrifugo/subscribe/route.ts) constant-time compares the incoming
      # X-Centrifugo-Proxy-Secret header against its CENTRIFUGO_PROXY_SECRET env
      # var; an EMPTY app secret skips the check (fail-open, backward compatible).
      #
      # v6 NOTE (load-bearing — do NOT revert to v5): the field is `http.static_headers`
      # (a map). The v5 key `static_http_headers` is UNKNOWN to v6 — it logs
      # "unknown key in configuration file" and silently drops the header, so the
      # app then rejects EVERY subscribe and realtime chat dies for everyone
      # (prod outage 2026-06-20). The secret is NOT a literal here: v6.3.0+
      # extrapolates ${CENTRIFUGO_VAR_*} into map values, so docker-compose bridges
      # CENTRIFUGO_PROXY_SECRET → CENTRIFUGO_VAR_PROXY_SECRET (one source of truth).
      # Empty value → empty header → app skips the check → chat still works.
      # Drift guard: deploy/__tests__/centrifugo-proxy-secret.test.ts
      http:
        static_headers:
          X-Centrifugo-Proxy-Secret: "${CENTRIFUGO_VAR_PROXY_SECRET}"

  namespaces:
    # chat namespace — channel convention: chat:conversation:<uuid>
    # Centrifugo splits at the first colon; this namespace MUST exist or every
    # subscribe is rejected with "namespace not found" before the proxy is called.
    - name: chat
      # presence: email-suppression reads channel presence (online recipient → skip digest mail).
      presence: true
      # join_leave: live online/offline presence dots in the UI.
      join_leave: true
      # Route every subscribe through the ACL proxy above.
      subscribe_proxy_enabled: true

    # team namespace — channel convention: team:rfp:<rfpId>:<workspaceId>
    - name: team
      subscribe_proxy_enabled: true

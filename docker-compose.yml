services:
  pg:
    image: postgres:16-alpine
    container_name: supporter-b-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: supporter_b
      POSTGRES_PASSWORD: supporter_b
      POSTGRES_DB: supporter_b
    volumes:
      - supporter_b_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supporter_b -d supporter_b"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-test:
    image: postgres:16-alpine
    container_name: supporter-b-pg-test
    profiles: ["test"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: supporter_b
      POSTGRES_PASSWORD: supporter_b
      POSTGRES_DB: supporter_b_test
    volumes:
      - supporter_b_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supporter_b -d supporter_b_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: supporter-b-centrifugo
    profiles: ["realtime"]
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-secret}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000}

volumes:
  supporter_b_pgdata:
    driver: local
    name: supporter_b_pgdata
  supporter_b_pgdata_test:
    driver: local
    name: supporter_b_pgdata_test

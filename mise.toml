# Node 버전의 단일 출처다. 로컬은 mise 가, CI 는 setup-node(node-version-file)가
# 이 값을 읽는다. Lightsail bootstrap도 이 값에서 설치 버전을 읽으며,
# perf.yml 컨테이너의 고정값은 lib/__tests__/node-version-source.test.ts 가 검사한다.
# 버전만 적는다 — 템플릿·[env]·hooks 를 넣으면 mise 가 trust 를 요구하고,
# trust 하지 않은 워크트리는 경고 한 줄 뒤 시스템 node 로 돌아간다.
[tools]
node = "22.23.4"

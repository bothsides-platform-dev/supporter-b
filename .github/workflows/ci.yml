name: ci

# lint + tsc · unit · e2e 를 `main`/`dev` 대상 PR 과 `main` push 에서 모두 돌린다.
#
# 왜 e2e 를 PR 로 옮겼나 (2026-08-26): e2e 잡이 `main` push 전용이었던 탓에 PR 은
# 그 체크가 **보고되지 않은 채** 통과했고(브랜치 보호는 required 로 걸어 뒀는데도),
# 깨진 스펙 6개가 2026-07-01부터 두 달 가까이 머지돼 들어왔다. 게이트가 머지 뒤에
# 있으면 게이트가 아니다. 기능 브랜치 → dev PR 에 CI 가 없던 기존 설계도 여기서
# 함께 뒤집는다 — dev 로 들어오는 변경이 로컬 검증에만 기대고 있었다.
#
# 비용: PR 당 e2e ~5-10분(Next + Postgres 서비스 컨테이너 + Playwright).
# `retries: 0` 은 유지한다 — 재시도는 플레이크를 숨긴다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: lint + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      # No drizzle journal/migration check — the project is push-only and has
      # no `drizzle/` migrations folder. Schema is diffed straight from
      # `lib/db/schema` by `drizzle-kit push` (see the e2e job).

  unit-test:
    name: unit (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vitest workspace projects: unit-node uses pglite (no docker
      # needed), unit-jsdom uses RTL. 280+ tests, all in-process.
      # --maxWorkers=4: default fork-pool concurrency over-provisions workers
      # relative to runner RAM, occasionally crashing a worker fork under
      # memory pressure ("Worker exited unexpectedly" unhandled error, seen
      # locally too — see project memory: full-suite-slow-swap-thrash).
      - run: pnpm test -- --maxWorkers=4

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supporter_b
          POSTGRES_PASSWORD: supporter_b
          POSTGRES_DB: supporter_b_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U supporter_b -d supporter_b_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://supporter_b:supporter_b@localhost:5433/supporter_b_test
      DATABASE_URL_TEST: postgres://supporter_b:supporter_b@localhost:5433/supporter_b_test
      AUTH_SECRET: e2e-test-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NEXT_PUBLIC_BASE_URL: http://localhost:3001
      RESEND_API_KEY: ''
      NTS_SERVICE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Create the schema on the fresh Postgres service as a baseline.
      # `drizzle-kit push` diffs lib/db/schema → DB directly (push-only project,
      # no migrations folder); --force skips the data-loss prompt (a no-op on a
      # fresh DB that only receives CREATEs). global-setup then runs
      # `pnpm e2e:reset`, which drops + recreates the schema from the same
      # lib/db/schema and seeds — so e2e:reset is authoritative, this is just a
      # baseline. DATABASE_URL is read from the job env above.
      - name: apply schema to test DB
        run: pnpm exec drizzle-kit push --force
      # Playwright browsers (chromium only — matches projects[] config).
      # `pnpm exec` uses the lockfile-pinned playwright@1.59.1, not a
      # transient dlx fetch.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

name: ci

# Step 14 — gate every PR with lint + unit tests; gate `main` pushes
# additionally with the e2e suite (Playwright A/B/C against a real
# Postgres service container).
#
# Why split: e2e boots Next.js + Postgres + Playwright (~3-5min). PRs
# stay fast (lint+unit only). Main push catches regressions before any
# tag/deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      # No drizzle journal/migration check — the project is push-only and has
      # no `drizzle/` migrations folder. Schema is diffed straight from
      # `lib/db/schema` by `drizzle-kit push` (see the e2e job).

  unit-test:
    name: unit (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vitest workspace projects: unit-node uses pglite (no docker
      # needed), unit-jsdom uses RTL. 280+ tests, all in-process.
      - run: pnpm test

  presence-integration:
    name: presence integration (live Centrifugo v6)
    # The ONLY guard for the v6 permission/delivery class (mocks give false green —
    # that is how chat typing broke silently). Boots an ephemeral Centrifugo v6 from
    # the REPO config (deploy/centrifugo/config.yaml) and runs presence.integration.test.ts
    # ONLY. Gated by CENTRIFUGO_INTEGRATION=1; the default unit job never boots docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Boot Centrifugo v6 with the repo config + a known HMAC secret. We use an
      # explicit `docker run` (not a services: block) because the suite must mount the
      # real config.yaml and override the entrypoint command — service containers can do
      # neither. CENTRIFUGO_VAR_PROXY_SECRET (empty) satisfies the config's ${…}
      # subscribe-proxy header expansion; the proxy endpoint is never hit (we only touch
      # the proxy-less presence namespace).
      - name: boot ephemeral Centrifugo v6
        run: |
          docker run -d --name cent-smoke -p 8000:8000 \
            -v "$PWD/deploy/centrifugo/config.yaml:/centrifugo/config.yaml" \
            -e CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=test-secret \
            -e CENTRIFUGO_VAR_PROXY_SECRET= \
            centrifugo/centrifugo:v6 centrifugo -c /centrifugo/config.yaml
          # Wait for the WebSocket endpoint to come up (fail fast if the config is rejected).
          for i in $(seq 1 30); do
            if docker logs cent-smoke 2>&1 | grep -q "serving websocket"; then
              echo "Centrifugo ready"; exit 0
            fi
            sleep 1
          done
          echo "Centrifugo did not become ready — logs:"; docker logs cent-smoke; exit 1
      - name: run presence integration smoke
        env:
          CENTRIFUGO_INTEGRATION: '1'
          NEXT_PUBLIC_CENTRIFUGO_WS_URL: ws://localhost:8000/connection/websocket
          CENTRIFUGO_TOKEN_HMAC_SECRET: test-secret
        run: pnpm test:integration
      - name: Centrifugo logs (on failure)
        if: failure()
        run: docker logs cent-smoke
      - name: teardown Centrifugo
        if: always()
        run: docker rm -f cent-smoke || true

  e2e:
    name: e2e (playwright)
    # Only on main push — PRs already covered by lint + unit-test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supporter_b
          POSTGRES_PASSWORD: supporter_b
          POSTGRES_DB: supporter_b_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U supporter_b -d supporter_b_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://supporter_b:supporter_b@localhost:5433/supporter_b_test
      DATABASE_URL_TEST: postgres://supporter_b:supporter_b@localhost:5433/supporter_b_test
      AUTH_SECRET: e2e-test-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NEXT_PUBLIC_BASE_URL: http://localhost:3001
      RESEND_API_KEY: ''
      NTS_SERVICE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Create the schema on the fresh Postgres service as a baseline.
      # `drizzle-kit push` diffs lib/db/schema → DB directly (push-only project,
      # no migrations folder); --force skips the data-loss prompt (a no-op on a
      # fresh DB that only receives CREATEs). global-setup then runs
      # `pnpm e2e:reset`, which drops + recreates the schema from the same
      # lib/db/schema and seeds — so e2e:reset is authoritative, this is just a
      # baseline. DATABASE_URL is read from the job env above.
      - name: apply schema to test DB
        run: pnpm exec drizzle-kit push --force
      # Playwright browsers (chromium only — matches projects[] config).
      # `pnpm exec` uses the lockfile-pinned playwright@1.59.1, not a
      # transient dlx fetch.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

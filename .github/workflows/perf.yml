name: perf

# PR: smoke (2 VU, 1분) — 빠른 회귀 확인
# main push: load (10 VU, 20분) — 평균 부하 검증
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  perf:
    name: k6 performance test
    runs-on: ubuntu-latest
    # load 테스트(main push)는 20분 + 빌드/설치 오버헤드 → 35분 백스톱.
    # PR(smoke만)은 ~5분이지만 동일 잡이라 최악(=load) 기준으로 잡는다.
    timeout-minutes: 35
    # 잡 전체를 격리된 Node.js 컨테이너 안에서 실행
    container:
      # Official registry OCI index, SHA256 verified on 2026-11-08:
      # https://registry-1.docker.io/v2/library/node/manifests/22.23.4-bookworm-slim
      image: node:22.23.4-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
      options: --user root

    services:
      postgres:
        # Official registry OCI index verified on 2026-11-08 (linux/amd64).
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: supporter_b
          POSTGRES_PASSWORD: supporter_b
          POSTGRES_DB: supporter_b_perf
        # container: 사용 시 서비스는 서비스 이름(postgres)이 호스트명 —
        # 외부 포트 매핑 불필요
        options: >-
          --health-cmd "pg_isready -U supporter_b -d supporter_b_perf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # localhost → postgres (컨테이너 간 Docker 네트워크 호스트명)
      DATABASE_URL: postgres://supporter_b:supporter_b@postgres:5432/supporter_b_perf
      DATABASE_URL_TEST: postgres://supporter_b:supporter_b@postgres:5432/supporter_b_perf
      AUTH_SECRET: perf-test-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3002
      NEXT_PUBLIC_BUYER_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_PARTNER_ORIGIN: http://localhost:3002
      # 빈 문자열은 production 부팅 가드(lib/env/check-production-config.ts)에 걸려
      # `pnpm start`가 안 뜸. 가짜(non-empty) 키로 부팅만 통과시킨다.
      # 이메일은 outbox→cron flush 경로라 k6 부하만으로는 실제 Resend 호출이 없다.
      RESEND_API_KEY: "re_perf_fake_0000000000000000000000"
      # R2는 첨부파일 전용 스토리지 — perf 부하 시나리오(smoke/load)가 첨부 업/다운로드를
      # 다루지 않아 실제 버킷 접근이 없다. checkProductionConfig 부팅 가드만 통과시키는 가짜 값.
      R2_ACCOUNT_ID: "perf0000000000000000000000fake0"
      R2_ACCESS_KEY_ID: "perf_fake_access_key_id_00000000"
      R2_SECRET_ACCESS_KEY: "perf_fake_secret_access_key_0000000000000000000000000000"
      R2_BUCKET: "perf-fake-bucket"
      # perf 서버는 production(next start)이라 세션 쿠키가 Secure → 평문 http 의 k6 가
      # 재전송 못 해 인증 페이지를 못 잰다. http 오리진에서만 비-Secure 쿠키를 발급하게
      # 한다(lib/auth/cookie-config.ts; https 배포에선 무시되어 실 prod 불가침).
      AUTH_INSECURE_COOKIES: "true"
      NTS_SERVICE_KEY: ""
      CENTRIFUGO_URL: ""
      NEXT_PUBLIC_CENTRIFUGO_URL: ""

    steps:
      # bookworm-slim에는 git·jq·curl이 없으므로 checkout 전에 설치
      - name: Install system deps
        run: apt-get update -qq && apt-get install -y -qq git jq curl

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned pnpm from package.json
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── DB 세팅 ─────────────────────────────────────────────────────────
      - name: Apply schema
        run: pnpm exec drizzle-kit push --force

      - name: Seed perf data
        id: seed
        run: |
          mkdir -p tests/perf
          # pnpm perf:seed가 출력하는 JSON을 파일 저장 + GITHUB_OUTPUT에 주입
          SEED_JSON=$(pnpm perf:seed)
          echo "$SEED_JSON" > tests/perf/seed-data.json
          echo "BUYER_EMAIL=$(echo "$SEED_JSON" | jq -r '.buyerEmail')"  >> "$GITHUB_OUTPUT"
          echo "PG_EMAIL_0=$(echo "$SEED_JSON"  | jq -r '.pgEmails[0]')" >> "$GITHUB_OUTPUT"
          echo "RFP_ID_0=$(echo "$SEED_JSON"    | jq -r '.rfpIds[0]')"   >> "$GITHUB_OUTPUT"

      # ── Next.js 빌드 + action ID 추출 ───────────────────────────────────
      - name: Build Next.js
        run: pnpm build

      - name: Extract Server Action IDs
        run: node scripts/extract-action-ids.mjs

      # ── 서버 기동 ────────────────────────────────────────────────────────
      - name: Start Next.js server
        # 백그라운드 서버 로그를 파일로 캡처 — 기동 실패 원인을 진단 가능하게
        run: |
          PORT=3002 nohup pnpm start > /tmp/next-server.log 2>&1 &
          echo "started next server (pid $!)"

      - name: Wait for server
        # curl 자체가 무한 대기(연결됐지만 응답 없음)하는 행을 막는 하드 백스톱
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            # --connect-timeout: 부팅 중 거부는 즉시 실패(빠른 재시도)
            # --max-time: 연결됐지만 응답 없는 요청도 5초에 끊어 루프 카운터를 살린다
            if curl -sf --connect-timeout 3 --max-time 5 http://localhost:3002/api/auth/csrf > /dev/null; then
              echo "Server ready"; exit 0
            fi
            echo "Waiting... ($i/30)"; sleep 2
          done
          echo "Server failed to start — last 100 lines of server log:"
          tail -n 100 /tmp/next-server.log || true
          exit 1

      # ── k6 설치 ─────────────────────────────────────────────────────────
      - name: Install k6
        env:
          K6_VERSION: '1.8.2'
          # https://github.com/grafana/k6/releases/download/v1.8.2/k6-v1.8.2-checksums.txt
          K6_SHA256: 37620781d35406ebf402397a6c5cf4adb62d175cb052ff45325ae0b860527063
        run: |
          set -eu
          archive="$RUNNER_TEMP/k6-v$K6_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/grafana/k6/releases/download/v$K6_VERSION/k6-v$K6_VERSION-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$K6_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" "k6-v$K6_VERSION-linux-amd64/k6"
          install -m 0755 "$RUNNER_TEMP/k6-v$K6_VERSION-linux-amd64/k6" /usr/local/bin/k6

      # ── Smoke test (PR + main) ───────────────────────────────────────────
      - name: Run smoke test
        run: |
          k6 run \
            -e BASE_URL=http://localhost:3002 \
            -e TEST_BUYER_EMAIL=${{ steps.seed.outputs.BUYER_EMAIL }} \
            -e TEST_BUYER_PASSWORD=perf-password-123 \
            -e TEST_PG_EMAIL=${{ steps.seed.outputs.PG_EMAIL_0 }} \
            -e TEST_PG_PASSWORD=perf-password-123 \
            -e TEST_RFP_ID=${{ steps.seed.outputs.RFP_ID_0 }} \
            tests/perf/smoke.js

      # ── Load test (main push 전용) ───────────────────────────────────────
      - name: Run load test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          k6 run \
            -e BASE_URL=http://localhost:3002 \
            -e TEST_BUYER_EMAIL=${{ steps.seed.outputs.BUYER_EMAIL }} \
            -e TEST_BUYER_PASSWORD=perf-password-123 \
            -e TEST_PG_EMAIL=${{ steps.seed.outputs.PG_EMAIL_0 }} \
            -e TEST_PG_PASSWORD=perf-password-123 \
            -e TEST_RFP_ID=${{ steps.seed.outputs.RFP_ID_0 }} \
            tests/perf/load.js

      # ── 결과 아티팩트 ────────────────────────────────────────────────────
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-results-${{ github.run_number }}
          path: |
            tests/perf/action-ids.json
            tests/perf/seed-data.json
          retention-days: 14

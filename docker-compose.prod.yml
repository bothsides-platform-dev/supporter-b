# Production Postgres — runs on the same Lightsail instance as the native app.
# Bound to 127.0.0.1 only: the DB is never exposed to the public internet.
# The Next.js app runs natively (PM2) and reaches this via localhost:5432.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Reads POSTGRES_PASSWORD from .env.production (keep it strong).
services:
  pg:
    image: postgres:16-alpine
    container_name: bidit-pg-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supporter_b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-supporter_b}
    volumes:
      - bidit_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supporter_b} -d ${POSTGRES_DB:-supporter_b}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Realtime fanout for chat. Like pg, bound to 127.0.0.1 only — never exposed
  # to the public internet directly. The browser reaches it through Caddy's
  # wss:// reverse proxy (deploy/Caddyfile, /connection/* -> 127.0.0.1:8000).
  # The Next.js app (PM2:3000, native on the host) publishes via the HTTP API at
  # 127.0.0.1:8000/api. Centrifugo persists nothing — Postgres is canonical.
  #
  # Secrets live in .env.production, NOT in config.yaml (Centrifugo does not
  # interpolate ${VAR} in config files). docker-compose interpolates the
  # environment: block below from .env.production and bridges the app-named vars
  # to Centrifugo's v6 nested-key env names (same value, two consumers):
  #   app CENTRIFUGO_TOKEN_HMAC_SECRET -> CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
  #   app CENTRIFUGO_API_KEY           -> CENTRIFUGO_HTTP_API_KEY
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: bidit-centrifugo-prod
    restart: always
    command: centrifugo -c /centrifugo/config.yaml
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/centrifugo/config.yaml:/centrifugo/config.yaml:ro
    # The app runs natively on the host, not in Docker. The subscribe proxy
    # (Centrifugo -> app) therefore reaches it via host.docker.internal, mapped
    # to the host gateway (works on Linux/Lightsail). config.yaml references this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?set CENTRIFUGO_TOKEN_HMAC_SECRET in .env.production}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY in .env.production}
      # Both public hosts serve the same bundle and connect to the same WS URL
      # (wss://<APP_DOMAIN>/connection/websocket). Centrifugo checks the browser
      # Origin header against this space-separated list, so BOTH the buyer apex
      # and the PG partner subdomain must be present — otherwise PG handshakes
      # are rejected and realtime chat silently dies for every PG user.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN in .env.production} https://partner.${APP_DOMAIN}
      # Subscribe-proxy shared-secret header. The app reads CENTRIFUGO_PROXY_SECRET
      # directly; the container receives the SAME value under the CENTRIFUGO_VAR_
      # prefix that Centrifugo v6.3.0+ extrapolates into config.yaml's proxy
      # http.static_headers map (deploy/centrifugo/config.yaml). ':-' makes it
      # optional/empty — fail-open: the app skips the check when its own secret is
      # empty. One source of truth → no half-on footgun (set one side, not both).
      CENTRIFUGO_VAR_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET:-}
    # Centrifugo ships a default ulimit-friendly image; no extra tuning needed
    # for a single 2GB VM with Memory engine.

volumes:
  bidit_pgdata_prod:
    driver: local
    name: bidit_pgdata_prod
